[workspace]
resolver = "2"
members = ["crates/grt-container", "crates/grtb", "crates/grtb-convert", "src-tauri"]

[workspace.package]
version = "0.1.0"
authors = ["GRT Project"]
license = "MIT"
edition = "2021"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
sha2 = "0.10"
flate2 = "1"
unicode-normalization = "0.1"
zip = { version = "2", default-features = false, features = ["deflate"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true

[profile.dev.package."*"]
opt-level = 2
