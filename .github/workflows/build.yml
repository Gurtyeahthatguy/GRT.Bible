# Tests the Rust crates and the interface, then builds the Linux binary.

name: build

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev \
            libayatana-appindicator3-dev libssl-dev patchelf

      - name: Install
        run: npm ci

      - name: Test
        run: |
          cargo test --workspace
          npm test

      - name: Build
        run: npx tauri build --no-bundle

      - name: No-trace check
        run: ./scripts/check-build.sh target/release/grt-bible

      - uses: actions/upload-artifact@v7
        with:
          name: grt-bible-linux
          path: target/release/grt-bible
          if-no-files-found: error
